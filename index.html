<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Party Battles</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1b1530; }
  body { font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 4px #000a; }
  #top { top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-weight: 900; font-size: 22px; }
  #top small { display: block; font-size: 13px; font-weight: 700; opacity: .85; }
  #timer { width: min(260px, 60vw); height: 6px; margin: 6px auto 0; border-radius: 4px; background: #ffffff26; overflow: hidden; }
  #timer i { display: block; height: 100%; width: 0; background: #ffd166; }
  #msg { top: 30%; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 900; transition: opacity .4s; opacity: 0; }
  #msg small { display: block; font-size: 16px; font-weight: 700; opacity: .9; }
  #net { bottom: max(4px, env(safe-area-inset-bottom)); left: max(12px, env(safe-area-inset-left)); font-size: 12px; opacity: .75; }
  #panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(8px, env(safe-area-inset-bottom)) + 16px); width: min(580px, calc(100vw - 20px)); box-sizing: border-box;
           padding: 10px 12px; border-radius: 16px; background: #120e22e8; border: 1px solid #ffffff26; box-shadow: 0 8px 30px #0008; }
  #panel[hidden], #over[hidden] { display: none; }
  #who { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 800; font-size: 15px; margin-bottom: 8px; }
  #who small { font-weight: 600; opacity: .8; font-size: 12px; white-space: nowrap; }
  #acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #acts button { min-height: 52px; border: 0; border-radius: 12px; background: #2d2552; color: #fff; font: 800 14px system-ui, sans-serif; cursor: pointer; padding: 4px; }
  #acts button small { display: block; font-weight: 600; font-size: 11px; opacity: .8; }
  #acts button.on { background: #ffd166; color: #2a1a00; }
  #acts button:disabled { opacity: .38; cursor: default; }
  #tip { margin-top: 8px; font-size: 13px; text-align: center; min-height: 18px; color: #e9e2ff; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0816c0; }
  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 88vh; overflow: auto; padding: 20px; border-radius: 16px; background: #221a3d; border: 1px solid #ffffff26; text-align: center; }
  .card h2 { margin: 0; font-size: 25px; color: #ffd166; } .card h3 { margin: 14px 0 4px; font-size: 13px; color: #b9a6ff; text-align: left; }
  .card p { margin: 6px 0; font-size: 14px; opacity: .85; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; } .card li span { float: right; font-variant-numeric: tabular-nums; }
  .card li.note { list-style: none; margin-left: -24px; opacity: .8; } /* a message, not a ranked line */
  button.go { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 12px; background: #ffd166; color: #2a1a00; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  @media (max-width: 640px) { #acts { grid-template-columns: 1fr 1fr; } #msg { font-size: 28px; } }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="top"><span id="wave"></span><div id="timer"><i></i></div></div>
<div class="hud" id="msg"></div>
<div id="panel">
  <div id="who"></div>
  <div id="acts"><button data-a="atk"></button><button data-a="skill"></button><button data-a="item"></button><button data-a="def"></button></div>
  <div id="tip"></div>
</div>
<div class="hud" id="net">Connecting…</div>
<div id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><p id="overSub"></p>
  <h3>Most waves cleared</h3><ol id="board"><li class="note">Loading…</li></ol>
  <button class="go" id="again">Play again</button><p id="overNext"></p>
</div></div>
<script>
/* ═══ PARTY BATTLES · a Multiplayer Agent starter ══════════════════════════════════════
 * Pick your hero's move. Beat the waves, then the boss. Co-op, 1–4 players; bots play any
 * hero nobody has.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ timers, the four hero classes and their skills, the monsters
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   RULES ......... waves, a turn's moves resolved into a log, the bots' choices (plain functions)
 *   HOST .......... seats, phases (wave → plan → act → plan … → over). Only the host writes `battle`.
 *   ME ............ my seat, my pick for this turn
 *   SCENE ......... background, heroes, monsters, the turn's log played back, effects, sounds
 *   PANEL & RESULTS  the action buttons and targets, the timer, the results and the leaderboard
 *   MAIN LOOP ..... heartbeat, host tick, drawing
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code, the HOST's browser runs the battle):
 *   - The whole battle is ONE shared JSON field, `battle`, written only by the host and only when
 *     something changes: {id, v, ph: wave|plan|act|over, w (wave), r (turn), at, end, lv,
 *     hs (heroes: class, name, color, who plays it, hp, mp, down), fs (monsters), bag (potions),
 *     log (the last turn, move by move), h0/f0 (health at the start of that turn), cleared}.
 *     `v` goes up on every write; `end` is a timestamp, never a countdown.
 *   - Each player writes its OWN entity: `pick` {r: "battle.wave.turn", a: move, t: target}
 *     for its hero this turn, `n`/`c` (name, color) and `hb` (heartbeat) once a second.
 *     Picks live in state, so a new host still sees them.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s). It
 *     seats players on heroes (bots play the rest), resolves the turn when everyone has picked
 *     (or the timer runs out: a bot picks for you), and plays the monsters.
 *   - Every client plays the turn's log back on the same clock (move k at at + k × stepMs),
 *     so everyone sees the same fight. "again" (intent) starts a new run from the results.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "best-wave": the most waves each player's party cleared in one run.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  planMs: 15000,       // time to pick a move before a bot picks for you
  stepMs: 700,         // how long each move of a turn takes to play out
  waveMs: 2600,        // the pause between waves
  resultsMs: 15000,    // the results show this long, then a new run starts
  bossEvery: 5,        // every 5th wave is a boss (and the party levels up after it)
  potions: 3,          // potions in the party's bag at the start (+1 after each wave)
  potionHeal: 50,      // health a potion gives back (a downed hero gets up with 35%)
  waveHeal: 0.25,      // share of max health every hero gets back after a wave
  seatGraceMs: 8000,   // a player silent this long hands its hero to a bot
  board: "best-wave",  // leaderboard name
};
// skill: what the class button does. power: damage or healing (Backstab: × attack).
const CLASSES = [
  { name: "Knight", hp: 150, mp: 30, atk: 13, skill: "Taunt", cost: 10, tip: "Defend, and every monster hits you this turn", bot: "Sir Bonk", color: "#5aa0ff" },
  { name: "Mage", hp: 85, mp: 60, atk: 8, skill: "Fireball", cost: 14, power: 17, tip: "Burn every monster", bot: "Zara", color: "#c77dff" },
  { name: "Cleric", hp: 100, mp: 50, atk: 9, skill: "Heal", cost: 12, power: 30, tip: "Heal every hero who is still up", bot: "Mother Mel", color: "#ffd23f" },
  { name: "Rogue", hp: 95, mp: 40, atk: 14, skill: "Backstab", cost: 10, power: 2.2, tip: "A huge hit on one monster", bot: "Pip", color: "#52d273" },
];
// wave = the first wave a monster shows up on.
const FOES = [
  { name: "Slime", hp: 32, atk: 8, wave: 1 },
  { name: "Bat", hp: 24, atk: 9, wave: 1 },
  { name: "Goblin", hp: 38, atk: 11, wave: 2 },
  { name: "Skeleton", hp: 50, atk: 12, wave: 3 },
  { name: "Wolf", hp: 44, atk: 14, wave: 4 },
  { name: "Ember Drake", hp: 380, atk: 20, wave: 99, boss: true },
];
const COLORS = ["#ff5a5a", "#4da6ff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42", "#ff6fb5", "#3de0d0"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'party-battles',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, { planMs: 600, stepMs: 470, waveMs: 900, resultsMs: 1500 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback); memo.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} }, joinedAt = 0;
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);
/** Still in the game for seating: heartbeat seen within seatGraceMs (a short hiccup keeps your hero). */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── RULES ───────────────────────────────────────────────────────────────────────────
const heroScale = (lv) => 1 + 0.15 * (lv - 1);          // the party gets 15% stronger after each boss
const foeScale = (w) => 1 + 0.12 * (w - 1);             // monsters get 12% tougher every wave
const maxHp = (k, lv) => Math.round(CLASSES[k].hp * heroScale(lv));
const isBossWave = (w) => w % CONFIG.bossEvery === 0;
const turnKey = (b) => `${b.id}.${b.w}.${b.r}`;
const roll = (n) => Math.max(1, Math.round(n * (0.85 + Math.random() * 0.3)));
/** A wave of monsters: more and tougher as the waves go up; every bossEvery-th wave is the Ember Drake and two friends. */
function makeWave(w) {
  const pool = FOES.map((F, t) => t).filter((t) => FOES[t].wave <= w && !FOES[t].boss), pick = () => pool[Math.floor(Math.random() * pool.length)];
  const types = isBossWave(w) ? [pick(), 5, pick()] : Array.from({ length: Math.min(5, 3 + Math.floor((w - 1) / 2)) }, pick);
  return types.map((t) => { const hp = Math.round(FOES[t].hp * foeScale(w) * (ATTRACT && !FOES[t].boss ? 3 : 1)); return { t, hp, mhp: hp }; }); // the preview's escorts last the whole clip
}
/** What a bot would pick for hero i: heal when hurt, burn a crowd, guard the weak, stab the strong. Not perfect on purpose. */
function botPick(b, i) {
  const h = b.hs[i], C = CLASSES[h.k], foes = b.fs.map((f, j) => j).filter((j) => b.fs[j].hp > 0);
  const weakest = foes.reduce((a, j) => (a < 0 || b.fs[j].hp < b.fs[a].hp ? j : a), -1), strongest = foes.reduce((a, j) => (a < 0 || b.fs[j].hp > b.fs[a].hp ? j : a), -1);
  const hurt = b.hs.map((x, j) => j).filter((j) => !b.hs[j].dn && b.hs[j].hp < maxHp(b.hs[j].k, b.lv) * 0.45), down = b.hs.findIndex((x) => x.dn);
  const canSkill = h.mp >= C.cost && Math.random() < 0.85;
  if (down >= 0 && b.bag > 0 && (h.k === 2 || Math.random() < 0.3)) return { a: "item", t: down };
  if (h.hp < maxHp(h.k, b.lv) * 0.25 && b.bag > 0 && Math.random() < 0.6) return { a: "item", t: i };
  if (h.k === 2 && canSkill && hurt.length) return { a: "skill" };
  if (h.k === 1 && canSkill && foes.length >= 2) return { a: "skill" };
  if (h.k === 0 && canSkill && (hurt.length || (isBossWave(b.w) && b.r % 3 === 0))) return { a: "skill" };
  if (h.k === 3 && canSkill) return { a: "skill", t: strongest };
  if (isBossWave(b.w) && b.r % 3 === 0 && Math.random() < 0.5) return { a: "def" };
  return { a: "atk", t: Math.random() < 0.7 ? weakest : foes[Math.floor(Math.random() * foes.length)] };
}
/** The move for hero i this turn: its player's pick if it made one, else a bot's. */
function pickFor(b, i) {
  const who = b.hs[i].w, key = turnKey(b);
  if (who === net.sessionId && myPick.r === key) return myPick;
  const p = who ? parseOnce("pick:" + who, S.entities.players[who]?.pick, null) : null;
  return p && p.r === key ? p : botPick(b, i);
}
/** Resolve a whole turn at once: every hero's move in seat order, then every monster's. The log is what everyone plays back. */
function resolveTurn(b) {
  const hs = b.hs.map((h) => ({ ...h })), fs = b.fs.map((f) => ({ ...f })), log = [], def = new Set();
  const h0 = hs.map((h) => h.hp), f0 = fs.map((f) => f.hp), up = () => hs.map((h, i) => i).filter((i) => !hs[i].dn), alive = () => fs.map((f, j) => j).filter((j) => fs[j].hp > 0);
  let bag = b.bag, taunt = -1;
  const hit = (h, i, d) => { d = def.has(i) ? Math.round(d / 2) : d; h.hp = Math.max(0, h.hp - d); if (!h.hp) h.dn = 1; return d; };
  for (let i = 0; i < hs.length; i++) {
    const h = hs[i], C = CLASSES[h.k];
    if (h.dn || !alive().length) continue;
    let p = pickFor(b, i);
    if (p.a === "skill" && h.mp < C.cost) p = { a: "atk", t: p.t };
    if (p.a === "item" && bag <= 0) p = { a: "def" };
    const foe = fs[p.t] && fs[p.t].hp > 0 ? p.t : alive()[0], atk = C.atk * heroScale(b.lv);
    if (p.a === "atk") { const crit = Math.random() < 0.1, d = roll(atk * (crit ? 1.8 : 1)); fs[foe].hp = Math.max(0, fs[foe].hp - d); log.push(["h" + i, "atk", foe, d, fs[foe].hp, crit ? 1 : 0]); }
    else if (p.a === "skill") {
      h.mp -= C.cost;
      if (h.k === 0) { def.add(i); taunt = i; log.push(["h" + i, "taunt"]); }
      else if (h.k === 1) { const ts = alive(), ds = ts.map((t) => { const d = roll(C.power * heroScale(b.lv)); fs[t].hp = Math.max(0, fs[t].hp - d); return d; }); log.push(["h" + i, "fire", ts, ds, ts.map((t) => fs[t].hp)]); }
      else if (h.k === 2) { const ts = up(), ds = ts.map((t) => { const d = Math.min(maxHp(hs[t].k, b.lv) - hs[t].hp, roll(C.power * heroScale(b.lv))); hs[t].hp += d; return d; }); log.push(["h" + i, "heal", ts, ds, ts.map((t) => hs[t].hp)]); }
      else { const crit = Math.random() < 0.25, d = roll(atk * C.power * (crit ? 1.5 : 1)); fs[foe].hp = Math.max(0, fs[foe].hp - d); log.push(["h" + i, "stab", foe, d, fs[foe].hp, crit ? 1 : 0]); }
    } else if (p.a === "item") {
      bag--; const t = hs[p.t] ? p.t : i, m = maxHp(hs[t].k, b.lv);
      if (hs[t].dn) { hs[t].dn = 0; hs[t].hp = Math.round(m * 0.35); log.push(["h" + i, "raise", t, hs[t].hp, hs[t].hp]); }
      else { const d = Math.min(m - hs[t].hp, CONFIG.potionHeal); hs[t].hp += d; log.push(["h" + i, "potion", t, d, hs[t].hp]); }
    } else { def.add(i); h.mp = Math.min(C.mp, h.mp + 8); log.push(["h" + i, "def"]); }
  }
  fs.forEach((f, j) => { // the monsters strike back
    if (f.hp <= 0 || !up().length) return;
    const F = FOES[f.t], atk = F.atk * foeScale(b.w) * (ATTRACT ? 0.45 : 1);
    if (F.boss && b.r % 3 === 0) { const ts = up(), ds = ts.map((t) => hit(hs[t], t, roll(atk * 0.6))); log.push(["f" + j, "breath", ts, ds, ts.map((t) => hs[t].hp)]); return; }
    const list = up(), t = taunt >= 0 && !hs[taunt].dn ? taunt : Math.random() < 0.35 ? list.reduce((a, c) => (hs[c].hp < hs[a].hp ? c : a)) : list[Math.floor(Math.random() * list.length)];
    const d = hit(hs[t], t, roll(atk)); log.push(["f" + j, "atk", t, d, hs[t].hp]);
  });
  for (const h of hs) if (!h.dn) h.mp = Math.min(CLASSES[h.k].mp, h.mp + 3);
  const now = Date.now();
  return { ...b, hs, fs, bag, log, h0, f0, ph: "act", at: now, end: now + log.length * CONFIG.stepMs + 700 };
}
/** After a turn plays out: next wave (everyone patched up), the end of the run, or the next turn. */
function afterTurn(b) {
  const now = Date.now();
  if (b.fs.every((f) => f.hp <= 0)) {
    const boss = isBossWave(b.w), lv = boss ? b.lv + 1 : b.lv;
    const hs = b.hs.map((h) => { const m = maxHp(h.k, lv); return { ...h, dn: 0, hp: h.dn ? Math.round(m * 0.3) : Math.min(m, Math.round(h.hp + m * (boss ? 1 : CONFIG.waveHeal))), mp: Math.min(CLASSES[h.k].mp, h.mp + 10) }; });
    return { ...b, hs, lv, cleared: b.w, w: b.w + 1, r: 0, ph: "wave", log: [], at: now, end: now + CONFIG.waveMs, bag: b.bag + 1 };
  }
  if (b.hs.every((h) => h.dn)) return { ...b, ph: "over", log: [], at: now, end: now + CONFIG.resultsMs };
  return { ...b, ph: "plan", r: b.r + 1, log: [], at: now, end: now + CONFIG.planMs };
}

// ── HOST ────────────────────────────────────────────────────────────────────────────
const host = { last: null, again: false };
/** The battle as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function battle() {
  const b = parseOnce("battle", S.shared.battle, null);
  return host.last && isHost() && (!b || host.last.v > b.v) ? host.last : b;
}
function writeBattle(b) { b = { ...b, v: (battle()?.v ?? 0) + 1 }; host.last = b; net.setShared("battle", JSON.stringify(b)); return b; }
const playerName = (id) => String(S.entities.players[id]?.n ?? "Hero").slice(0, 16);
const playerColor = (id) => S.entities.players[id]?.c || "#cccccc";
function newRun(prev) {
  const now = Date.now(), w = ATTRACT ? CONFIG.bossEvery : 1, lv = ATTRACT ? 2 : 1;
  const hs = CLASSES.map((C, k) => ({ k, n: C.bot, c: C.color, w: "", hp: maxHp(k, lv), mp: C.mp, dn: 0 }));
  return { id: (prev?.id ?? 0) + 1, ph: "wave", w, r: 0, at: now, end: now + (ATTRACT ? 200 : 1800), lv, hs, fs: [], bag: CONFIG.potions, log: [], h0: [], f0: [], cleared: 0 };
}
/** Players take bots' heroes (first come, first served); a player gone for seatGraceMs hands theirs back to a bot. */
function fixSeats(b) {
  const hs = b.hs.map((h) => ({ ...h }));
  let changed = false;
  hs.forEach((h) => { if (h.w && !stillHere(h.w)) { Object.assign(h, { w: "", n: CLASSES[h.k].bot, c: CLASSES[h.k].color }); changed = true; } });
  for (const id of ATTRACT ? [] : livePlayers()) {
    if (hs.some((h) => h.w === id)) continue;
    const free = hs.findIndex((h) => !h.w);
    if (free < 0) break;
    Object.assign(hs[free], { w: id, n: playerName(id), c: playerColor(id) }); changed = true;
  }
  for (const h of hs) if (h.w && (h.n !== playerName(h.w) || h.c !== playerColor(h.w))) { h.n = playerName(h.w); h.c = playerColor(h.w); changed = true; }
  return changed ? { ...b, hs } : null;
}
/** Everyone seated has picked (and the turn has been up for a moment), so no need to wait for the timer. */
function allPicked(b) {

    if (aiming && needsFoe(ui.choosing) && hp > 0) { ctx.strokeStyle = `rgba(255,209,102,${0.6 + Math.sin(t * 8) * 0.3})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y - (FOES[f.t].boss ? 70 : 30) * s, (FOES[f.t].boss ? 110 : 44) * s, 0, 7); ctx.stroke(); }
    drawFoe(p.x, p.y, s, f, rec, t);
    if (hp > 0) { bar(p.x, p.y + 12 * s, (FOES[f.t].boss ? 150 : 56) * s, hp / f.mhp, "#ff5d5d"); if (!ATTRACT) { ctx.font = `700 ${Math.max(11, 12 * s)}px system-ui`; ctx.textAlign = "center"; ctx.fillStyle = "#fffc"; ctx.fillText(FOES[f.t].name, p.x, p.y + 32 * s); } }
  });
  b.hs.forEach((h, i) => {
    const p = L.hero(i), hp = shown.hh[i] ?? h.hp, m = maxHp(h.k, b.lv), shownH = { ...h, dn: hp <= 0 ? 1 : 0 };
    drawHero(p.x, p.y, L.s, shownH, shown.hero[i], t, i === mine && !ATTRACT, aiming && ui.choosing === "item");
    bar(p.x, p.y + 12 * L.s, 60 * L.s, hp / m, hp / m > 0.4 ? "#5fe07a" : "#ff5d5d"); bar(p.x, p.y + 20 * L.s, 60 * L.s, h.mp / CLASSES[h.k].mp, "#6fa8ff");
    if (!ATTRACT) {
      const fs = Math.max(11, 13 * L.s); ctx.font = `800 ${fs}px system-ui`; ctx.textAlign = "center"; ctx.fillStyle = i === mine ? "#ffd166" : "#fff";
      ctx.fillText(`${i === mine ? "You" : h.n} · ${CLASSES[h.k].name}`, p.x, p.y + 28 * L.s + fs);
      const ready = h.w && (h.w === net.sessionId ? myPick.r === key : parseOnce("pick:" + h.w, S.entities.players[h.w]?.pick, null)?.r === key);
      ctx.font = `700 ${fs - 1}px system-ui`; ctx.fillStyle = !h.w ? "#b9a6ff" : ready ? "#7dffb0" : "#fff9";
      ctx.fillText(!h.w ? "bot" : b.ph !== "plan" || h.dn ? "" : ready ? "✓ ready" : "choosing…", p.x, p.y + 30 * L.s + fs * 2.1);
    }
  });
  const now = performance.now();
  for (let i = shots.length - 1; i >= 0; i--) { // fireballs and dragon fire
    const sh = shots[i], k = (now - sh.t) / 260;
    if (k >= 1) { burst(sh.tx, sh.ty, sh.kind === "breath" ? "#ff7a2a" : "#ffb347", 10, 3); shots.splice(i, 1); continue; }
    const x = sh.x + (sh.tx - sh.x) * k, y = sh.y + (sh.ty - sh.y) * k - Math.sin(k * Math.PI) * 30 * L.s;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 16 * L.s); g.addColorStop(0, "#fff6c8"); g.addColorStop(0.4, sh.kind === "breath" ? "#ff5a1f" : "#ff9a2a"); g.addColorStop(1, "rgba(255,80,0,0)");

  for (let i = bits.length - 1; i >= 0; i--) { const p = bits[i]; p.life += dt; if (p.life > p.max) { bits.splice(i, 1); continue; } p.vy += 400 * dt; p.x += p.vx * dt; p.y += p.vy * dt; ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.color; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }
  ctx.globalAlpha = 1;
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i], k = (now - p.t) / 1000;
    if (k > 1) { pops.splice(i, 1); continue; }
    ctx.font = `900 ${Math.round((p.big ? 30 : 22) * Math.max(0.8, L.s) * (ATTRACT ? 1.4 : 1) * (k < 0.15 ? 0.6 + k * 2.7 : 1))}px system-ui`; ctx.textAlign = "center"; ctx.globalAlpha = 1 - Math.max(0, k - 0.6) * 2.5;
    ctx.lineWidth = 5; ctx.strokeStyle = "#000b"; ctx.strokeText(p.text, p.x, p.y - k * 40); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y - k * 40);
  }

}
let audio = null;
function sfx(kind) {
  if (!audio || ATTRACT) return;
  const t = audio.currentTime, tone = (f0, f1, dur, v, type = "sine", at = 0) => { const o = audio.createOscillator(), g = audio.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t + at); o.frequency.exponentialRampToValueAtTime(f1, t + at + dur); g.gain.setValueAtTime(v, t + at); g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur); o.connect(g).connect(audio.destination); o.start(t + at); o.stop(t + at + dur); };
  if (kind === "hit") tone(220, 60, 0.15, 0.12, "square");
  else if (kind === "fire") tone(120, 600, 0.3, 0.08, "sawtooth");
  else if (kind === "heal") [660, 880, 1100].forEach((f, i) => tone(f, f, 0.15, 0.06, "triangle", i * 0.07));
  else if (kind === "roar") tone(140, 40, 0.8, 0.15, "sawtooth");
  else if (kind === "guard") tone(500, 300, 0.12, 0.08, "triangle");
  else if (kind === "pick") tone(700, 900, 0.07, 0.05, "triangle");
  else if (kind === "wave") [523, 659, 784].forEach((f, i) => tone(f, f, 0.18, 0.07, "triangle", i * 0.09));
}

// ── PANEL & RESULTS ─────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const needsFoe = (a) => a === "atk" || a === "skill-foe";
let board = null, boardFor = -1, lastPhase = "", netDown = false;
/** Set an element's HTML only when it changed (rewriting a button mid-click can swallow the click). */
function setHTML(el, html) { if (el.__html !== html) { el.__html = html; el.innerHTML = html; } }
const ACTION = (b, i) => { const h = b.hs[i], C = CLASSES[h.k]; return { atk: ["Attack", "one monster"], skill: [C.skill, `${C.cost} MP`], item: ["Potion", `×${b.bag}`], def: ["Defend", "half damage, +MP"] }; };
/** Tap an action: moves that need a target wait for a tap on a monster (or an ally, for a potion). */
function chooseAction(a) {
  const b = battle(), i = mySeat(b);
  if (!b || i < 0 || b.ph !== "plan" || b.hs[i].dn) return;
  const h = b.hs[i];
  if (a === "skill" && h.mp < CLASSES[h.k].cost) return;
  if (a === "item" && b.bag <= 0) return;
  if (a === "atk" || (a === "skill" && h.k === 3)) ui.choosing = a === "atk" ? "atk" : "skill-foe";
  else if (a === "item") ui.choosing = "item";
  else pick(a);
}
function chooseTarget(t) {
  if (!ui.choosing) return;
  if (ui.choosing === "item") pick("item", t); else pick(ui.choosing === "atk" ? "atk" : "skill", t);
}
for (const btn of document.querySelectorAll("#acts button")) btn.addEventListener("click", () => chooseAction(btn.dataset.a));
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const b = battle(); if (!b || !ui.choosing) return;
  const L = layout(b), list = ui.choosing === "item" ? b.hs.map((h, i) => [i, L.hero(i), 50]) : b.fs.map((f, j) => [j, L.foe(j), FOES[f.t].boss ? 110 : 50]).filter(([j]) => (shown.fh[j] ?? 1) > 0);
  let best = null, bd = Infinity;
  for (const [i, p, r] of list) { const d = Math.hypot(e.clientX - p.x, e.clientY - (p.y - r * L.s * 0.6)); if (d < r * L.s * 1.3 && d < bd) { bd = d; best = i; } }
  if (best !== null) chooseTarget(best);
});
addEventListener("keydown", (e) => {
  const n = +e.key;
  if (e.key === "Escape") { ui.choosing = ""; return; }
  if (!(n >= 1 && n <= 5)) return;
  const b = battle(); if (!b) return;
  if (ui.choosing) { const list = ui.choosing === "item" ? b.hs.map((h, i) => i) : b.fs.map((f, j) => j).filter((j) => b.fs[j].hp > 0); if (list[n - 1] !== undefined) chooseTarget(list[n - 1]); }
  else if (n <= 4) chooseAction(["atk", "skill", "item", "def"][n - 1]);
});
for (const ev of ["pointerdown", "keydown"]) addEventListener(ev, () => { try { audio ||= new AudioContext(); } catch {} }, { once: true });
cv.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
$("again").onclick = () => { if (isHost()) host.again = true; else net.send("again", {}); };
/** The top line, the panel (who you play, the four moves, what to do next) and the results card. */
function hud(b) {
  const now = Date.now(), i = mySeat(b), h = i >= 0 ? b.hs[i] : null, key = turnKey(b), touch = matchMedia("(pointer: coarse)").matches;
  $("msg").style.opacity = performance.now() < msgUntil ? 1 : 0;
  if (b.ph !== lastPhase) {
    if (b.ph === "wave") { banner(isBossWave(b.w) ? "Boss wave!" : `Wave ${b.w}`, isBossWave(b.w) ? "The Ember Drake" : b.cleared && isBossWave(b.cleared) ? `Party level ${b.lv}!` : b.w > 1 ? "Everyone patched up, +1 potion" : "Here they come"); sfx("wave"); }
    if (b.ph === "plan" && ui.choosing) ui.choosing = "";
    lastPhase = b.ph;
  }
  if (ATTRACT) { for (const id of ["top", "panel", "net"]) $(id).style.display = "none"; $("net").textContent = ""; return; }
  const boss = isBossWave(b.w);
  $("wave").innerHTML = b.ph === "over" ? "The party fell" : `Wave ${b.w}${boss ? " · BOSS" : ""}<small>${b.ph === "plan" ? `Turn ${b.r} · pick your move` : b.ph === "act" ? `Turn ${b.r}` : "Get ready"} · 🧪 ${b.bag}</small>`;
  $("timer").firstChild.style.width = b.ph === "plan" ? Math.max(0, (100 * (b.end - now)) / CONFIG.planMs) + "%" : "0%";
  const acts = ACTION(b, Math.max(0, i));
  for (const btn of document.querySelectorAll("#acts button")) {
    const a = btn.dataset.a, [label, sub] = acts[a];
    setHTML(btn, `${esc(label)}<small>${esc(sub)}</small>`);
    btn.disabled = !h || h.dn || b.ph !== "plan" || (a === "skill" && h.mp < CLASSES[h.k].cost) || (a === "item" && b.bag <= 0);
    btn.classList.toggle("on", !!h && b.ph === "plan" && (ui.choosing ? ui.choosing.startsWith(a) || (a === "skill" && ui.choosing === "skill-foe") : myPick.r === key && myPick.a === a));
  }
  setHTML($("who"), h ? `<span>You are the ${CLASSES[h.k].name}</span><small>HP ${h.hp}/${maxHp(h.k, b.lv)} · MP ${h.mp}/${CLASSES[h.k].mp}</small>` : `<span>Watching</span><small>all four heroes have players</small>`);
  const people = b.hs.filter((x) => x.w && !x.dn), ready = people.filter((x) => (x.w === net.sessionId ? myPick.r === key : parseOnce("pick:" + x.w, S.entities.players[x.w]?.pick, null)?.r === key)).length;
  $("tip").textContent = !h ? "You'll get a hero when one is free." : b.ph === "over" ? "" : h.dn && b.ph === "plan" ? "You're down. A friend's potion can get you up." :
    b.ph !== "plan" ? (b.ph === "act" ? "The turn plays out…" : "Next wave coming…") :
    ui.choosing === "item" ? (touch ? "Tap a hero to give the potion" : "Click a hero to give the potion (or 1–4)") : ui.choosing ? (touch ? "Tap a monster" : "Click a monster (or 1–5) · Esc to cancel") :
    myPick.r === key ? `Locked in. Waiting for the others (${ready}/${people.length})… you can still change it.` :
    boss && b.r % 3 === 0 ? "The drake is breathing in: Defend or Taunt!" : `${CLASSES[h.k].skill}: ${CLASSES[h.k].tip}`;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : netDown ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the battle" : ""}`;
  $("over").hidden = b.ph !== "over";
  if (b.ph === "over") {
    $("overTitle").textContent = `The party fell on wave ${b.w}`;
    $("overSub").textContent = `Waves cleared: ${b.cleared} · party level ${b.lv}`;
    $("overNext").textContent = `New run in ${Math.max(0, Math.ceil((b.end - now) / 1000))}s`;
    if (boardFor !== b.id) { boardFor = b.id; showBoard(b.cleared, i >= 0); }
  }
}
function showBoard(cleared, played) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li class=\"note\">Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li class=\"note\">Loading…</li>";
  (played && cleared > 0 ? board.submit(cleared).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score} waves</span></li>`).join("") : "<li class=\"note\">No runs yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li class=\"note\">Couldn't load the leaderboard.</li>"; });
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the battle meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(); else host.last = null;
  const b = battle();
  if (b) { playback(b); draw(b, dt); if (now - lastHud > 100 || b.ph !== lastPhase) { lastHud = now; hud(b); } $("msg").style.opacity = now < msgUntil ? 1 : 0; }
  else { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.drawImage(bg, 0, 0, W, H); }
}

(async function start() {
  fit();
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("again", () => { if (isHost()) host.again = true; });
  net.onDisconnect(() => { netDown = true; });
  net.onReconnect(() => { netDown = false; });
  joinedAt = performance.now();
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...CLASSES.map((C) => C.color)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  if (ATTRACT) $("panel").hidden = true;
  requestAnimationFrame(frame);
})();
</script>
